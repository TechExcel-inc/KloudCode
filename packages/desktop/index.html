<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kloud CoWork</title>
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="shortcut icon" href="/favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="flex flex-col h-dvh"></div>
    <!-- Shown the moment the window opens, before scripts load; index.tsx removes it once the app is ready. -->
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-spin"></div>
      <div class="boot-name">Kloud CoWork</div>
      <div id="boot-text">Loading, please wait…</div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--background-base, #f8f7f7);
        color: var(--text-weak, #6e6868);
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: var(--background-base, #131010);
          color: var(--text-weak, #a8a2a2);
        }
      }
      #boot .boot-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-strong, currentColor);
      }
      #boot .boot-spin {
        width: 26px;
        height: 26px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      ;(() => {
        const boot = document.getElementById("boot")
        // The database upgrade window has its own progress screen.
        if (location.pathname === "/loading") return boot.remove()
        const lang = navigator.language || ""
        if (/^zh/i.test(lang))
          document.getElementById("boot-text").textContent = /tw|hk|mo|hant/i.test(lang)
            ? "正在載入，請稍候…"
            : "正在加载，请稍候…"
      })()
    </script>
    <div data-tauri-decorum-tb class="w-0 h-0 hidden" />
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
